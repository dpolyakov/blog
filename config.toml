baseURL = "https://dimapolyakov.ru/"
locale = "ru-RU"
defaultContentLanguage = "ru"
title = "Дмитрий Поляков"
theme = "polyakov"
pluralizeListTitles = false
summaryLength = 42
enableEmoji = true
enableRobotsTXT = true

[pagination]
    pagerSize = 5

[permalinks]
    categories = "/categories/:slug/"
    tags = "/tags/:slug/"

[frontmatter]
    lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

[markup.goldmark.renderer]
    unsafe = true

[markup.highlight]
    lineNos = true
    noClasses = false

[markup.tableOfContents]
    endLevel = 6
    ordered = true

[params]
    siteDescription = ""
    siteLogo = "/icons/polyakov.svg"
    siteTwitter = "dpolyakov"
    mainSections = ["blog"]
    displayAuthor = false
    autoDetectImages = true
    enableTOC = true
    enablePostShare = true
    enablePostNav = true
    enableRelatedPosts = true
    relatedPostsNumber = 5
    includeContent = true
    displayPostDescription = true
    displayCategory = true
    enablePostTags = true
    yandexMetrikaId = 912262
    gtagId = ""

[params.author]
    name = "dpolyakov"

[related]
    threshold = 80
    includeNewer = true
    toLower = true

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "tags"
        weight = 95

    [[related.indices]]
        name = "date"
        weight = 10
        pattern = "2006"

[mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[outputFormats.SectionsAtom]
    mediaType = "application/atom+xml"
    baseName = "atom"

[outputFormats.SectionsRSS]
    mediaType = "application/rss+xml"
    baseName = "rss"

[outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search"

[outputs]
    home = ["HTML", "SectionsAtom", "SectionsRSS", "SearchIndex"]
    section = ["HTML"]
    taxonomy = ["HTML"]
    term = ["HTML"]

[[menu.main]]
    url = "/blog/"
    name = "Посты"
    weight = 2

[[menu.main]]
    url = "/categories/"
    name = "Категории"
    weight = 3

[[menu.main]]
    url = "/checked/"
    name = "Рекомендую"
    weight = 4
