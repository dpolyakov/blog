<header class="site-header shell">
  <div class="site-branding">
    <a class="site-brand" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    {{ with .Site.Params.siteDescription }}<p class="site-description">{{ . }}</p>{{ end }}
  </div>
  <div class="header-controls">
    <button class="theme-toggle" type="button" aria-label="Переключить цветовую тему" hidden><span aria-hidden="true">☾</span></button>
    <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="site-nav" hidden>Меню <span aria-hidden="true">☰</span></button>
  </div>
  <nav id="site-nav" class="site-nav" aria-label="Основная навигация">
    {{ range .Site.Menus.main }}
      {{ if and .Name .URL }}
        {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
        <a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    {{ end }}
  </nav>
</header>
