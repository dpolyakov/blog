name: Check content

on:
  pull_request:
    branches: [public]

permissions:
  contents: read

concurrency:
  group: content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Check post structure
        run: python3 scripts/check-content.py

      - name: Build production site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: hugo --gc --minify --destination "${RUNNER_TEMP}/blog-production"

      - name: Build all articles and check uploaded images
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo --buildDrafts --buildFuture --buildExpired --destination "${RUNNER_TEMP}/blog-all"
          python3 scripts/check-content.py --site "${RUNNER_TEMP}/blog-all"
